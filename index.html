<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}.mine{padding-bottom:max(68px,env(safe-area-inset-bottom,0px))!important}#toast{bottom:34%!important}</style><title>Big Two</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@600;700&family=Barlow+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one felt table. Top bar, three opponent seats around a centre pile, your hand and buttons along the bottom. Menus are overlays on the same felt. */
:root{--felt:#0e3a2f;--felt2:#082219;--ivory:#f7f1e1;--ink:#17171c;--red:#c23b32;--gold:#e0b45a;--dim:#8fb3a5;--panel:rgba(5,24,19,.86);--line:#2c5a4b;--fg:#eef5f0;--bad:#e8705f;
--cw:58px;--disp:'Bodoni Moda',Georgia,serif;--ui:'Barlow Condensed','Arial Narrow',sans-serif;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:radial-gradient(ellipse at 50% 40%,var(--felt) 0%,var(--felt2) 75%) var(--felt2);color:var(--fg);font-family:var(--ui);font-size:16px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{height:100%;display:flex;flex-direction:column;padding-inline:max(14px,env(safe-area-inset-left,0px)) max(14px,env(safe-area-inset-right,0px));box-sizing:border-box}
button{font:600 17px/1 var(--ui);letter-spacing:.08em;text-transform:uppercase;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:12px 16px;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}button:disabled{opacity:.35;cursor:default}
button.pri{background:var(--gold);color:#241a06;border-color:var(--gold)}
button.sm{padding:7px 10px;font-size:14px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:8px}
.bar b{font:700 22px var(--disp);letter-spacing:.04em}
.bar .rt{display:flex;gap:6px}
#table{flex:1;display:none;flex-direction:column;min-height:0}
.mid{flex:1;display:grid;grid-template-columns:76px 1fr 76px;grid-template-rows:auto 1fr;min-height:0;align-items:center}
.seat{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;transition:transform .2s}
.seat .av{width:40px;height:40px;border-radius:50%;background:#12503f;border:2px solid var(--line);display:grid;place-items:center;font:700 18px var(--disp)}
.seat.turn .av{border-color:var(--gold);box-shadow:0 0 0 4px #e0b45a44,0 0 18px #e0b45a99;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px #e0b45a22,0 0 24px #e0b45acc}}
.seat .nm{font:600 15px var(--ui);letter-spacing:.04em;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .cnt{display:flex;align-items:center;gap:4px;font:600 15px var(--ui);color:var(--dim)}
.seat .cnt i{display:inline-block;width:14px;height:19px;border-radius:3px;background:repeating-linear-gradient(45deg,#7a2b2b 0 3px,#5e1f1f 3px 6px);border:1px solid #f7f1e1aa}
.seat .tag{font:600 12px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--bad);height:14px}
.seat.low .cnt{color:var(--bad)}
.top{grid-column:1/4;display:flex;justify-content:center;padding:6px 0 0}
.left{grid-column:1;grid-row:2}.right{grid-column:3;grid-row:2}
.center{grid-column:2;grid-row:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-width:0}
.pile{display:flex;justify-content:center;min-height:calc(var(--pw) * 1.4);--cw:var(--pw)}
.pile .card{margin-left:-14px;animation:drop .32s cubic-bezier(.2,.9,.3,1.2) both}.pile .card:first-child{margin-left:0}
@keyframes drop{from{opacity:0;transform:translateY(-36px) scale(1.25) rotate(-6deg)}to{opacity:1;transform:none}}
.drawp{display:flex;align-items:center;gap:7px;font:600 16px var(--ui);color:var(--dim);min-height:30px}.drawp .stk{position:relative;width:26px;height:36px}.drawp .stk i{position:absolute;inset:0;border-radius:4px;background:repeating-linear-gradient(45deg,#7a2b2b 0 3px,#5e1f1f 3px 6px);border:1px solid #f7f1e1aa}.drawp .stk i:nth-child(1){transform:translate(-3px,-3px) rotate(-6deg)}.drawp .stk i:nth-child(2){transform:translate(3px,2px) rotate(5deg)}
.cap{font:500 17px/1.2 var(--ui);color:var(--fg);text-align:center;min-height:22px;max-width:100%}
.cap small{display:block;color:var(--dim);font-size:14px}
.mine{padding-bottom:max(10px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.info{display:flex;justify-content:space-between;align-items:baseline;font:500 16px var(--ui);color:var(--dim);min-height:20px}
.info b{color:var(--fg);font-weight:600}.info .bad{color:var(--bad)}.info .ok{color:var(--gold)}
.hand{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:22px;min-height:calc(var(--cw) * 1.4 + 22px)}.hr{display:flex;justify-content:center;flex-shrink:0}.mine{flex-shrink:0}.hand{flex-shrink:0}.hr .card:first-child{margin-left:0}
.hand .card{margin-left:var(--ml);transition:transform .14s ease}
.hand .card.sel{transform:translateY(-20px);box-shadow:0 0 0 2px var(--gold),0 6px 14px #000a}
.btns{display:flex;gap:8px}.btns button{flex:1}.btns .play{flex:1.6}
.card{width:var(--cw);height:calc(var(--cw) * 1.4);border-radius:calc(var(--cw) * .12);background:var(--ivory);color:var(--ink);position:relative;box-shadow:0 2px 5px #0009;font-family:var(--disp);font-weight:700;flex:0 0 auto;cursor:pointer}
.card.red{color:var(--red)}
.card .r{position:absolute;left:calc(var(--cw) * .09);top:calc(var(--cw) * .05);font-size:calc(var(--cw) * .34);line-height:1}
.card .s{position:absolute;left:calc(var(--cw) * .1);top:calc(var(--cw) * .38);font-size:calc(var(--cw) * .26);line-height:1}
.card .c{position:absolute;right:calc(var(--cw) * .08);bottom:calc(var(--cw) * .03);font-size:calc(var(--cw) * .56);line-height:1}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(3,14,11,.9);display:none;align-items:center;justify-content:center;padding:16px}
.box{width:100%;max-width:440px;max-height:92vh;overflow-y:auto;background:linear-gradient(#0f3a2f,#0a2820);border:1px solid var(--line);border-radius:10px;padding:18px 18px 16px;box-sizing:border-box}
.box h1{margin:0 0 4px;font:700 44px/1 var(--disp);letter-spacing:.02em;text-align:center}
.box h2{margin:0 0 10px;font:700 28px/1.1 var(--disp);text-align:center}
.box p{margin:6px 0;color:var(--dim);font-size:16px;line-height:1.3}.box p.c{text-align:center}
.stack{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
input.code{width:100%;box-sizing:border-box;background:#06201a;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:11px;font:600 22px var(--ui);letter-spacing:.3em;text-align:center;text-transform:uppercase}
.big{font:700 46px/1 var(--disp);letter-spacing:.2em;text-align:center;color:var(--gold);margin:6px 0}
.list{margin:8px 0;display:flex;flex-direction:column;gap:5px}.list div{display:flex;justify-content:space-between;padding:7px 10px;background:#06201a;border-radius:6px;font-size:17px}
.list b{font-weight:600}.list span{color:var(--dim)}
.rules{font-size:15px;color:var(--fg)}.rules b{color:var(--gold)}.rules ul{margin:4px 0 8px;padding-left:18px;color:var(--dim)}
table.sc{width:100%;border-collapse:collapse;margin:8px 0}table.sc td,table.sc th{padding:6px 8px;text-align:right;border-bottom:1px solid #ffffff14;font-size:17px}table.sc td:first-child,table.sc th:first-child{text-align:left}
.hist{display:flex;flex-direction:column;gap:6px;max-height:52vh;overflow-y:auto}.he{display:flex;align-items:center;gap:8px;background:#06201a;border-radius:6px;padding:6px 9px;flex-wrap:wrap}.he b{font-weight:600;min-width:52px}.he .hd{color:var(--fg);flex:1;min-width:90px;font-size:15px}.he .hd.dim{color:var(--dim)}.hc{display:flex;--cw:30px}.hc .card{margin-left:-11px;box-shadow:0 1px 3px #000a}.hc .card:first-child{margin-left:0}
.pos{color:var(--gold)}.neg{color:var(--bad)}
#toast{position:fixed;left:50%;bottom:30%;transform:translateX(-50%);z-index:40;background:var(--panel);border:1px solid var(--gold);border-radius:6px;padding:9px 16px;font:600 17px var(--ui);display:none;max-width:86vw;text-align:center}
@media (max-height:520px){.mid{grid-template-columns:90px 1fr 90px}:root{--cw:44px}.seat .av{width:32px;height:32px;font-size:15px}.hand{padding-top:16px}}
@media (prefers-reduced-motion:reduce){.pile .card{animation:none}.seat.turn .av{animation:none}}
</style>
<div id="app">
 <div class="bar"><b>Big Two</b><div class="rt"><button class="sm" data-a="history">History</button><button class="sm" data-a="rules">Rules</button><button class="sm" data-a="menu">Menu</button></div></div>
 <div id="table">
  <div class="mid">
   <div class="top" id="s2"></div>
   <div class="left" id="s1"></div>
   <div class="center"><div class="drawp" id="drawp"></div><div class="pile" id="pile"></div><div class="cap" id="cap"></div></div>
   <div class="right" id="s3"></div>
  </div>
  <div class="mine">
   <div class="info"><span id="msg"></span><span id="hint"></span></div>
   <div class="hand" id="hand"></div>
   <div class="btns"><button data-a="pass" id="bpass">Pass</button><button data-a="sort" id="bsort" class="sm" style="flex:.7">Sort: rank</button><button data-a="hint" id="bhint" class="sm" style="flex:.7">Hint</button><button class="pri play" data-a="play" id="bplay">Play</button></div>
  </div>
 </div>
</div>
<div class="overlay" id="ov"><div class="box" id="box"></div></div>

 h+=ON.isHost?'<button class="pri" data-a="start"'+(ids.length<2?' disabled':'')+'>'+(ids.length<2?'Need at least 2 players':'Start game with '+ids.length)+'</button>':'<p class="c">Waiting for the host to start</p>';h+='<button class="sm" data-a="leave">Leave</button></div>';openBox(h)}
async function startOnline(){var ids=lobbyIds(ON.doc);if(ids.length<2){toast('Need at least 2 players');return}
 if(ON.net==='peer'){var g0=deal(ids.length);g0.players=ids;ON.doc.status='playing';ON.doc.game=g0;ON.doc.round=1;ON.doc.scores=[0,0,0,0];M.seenOver=-1;closeBox();bcast();return}var g=deal(ids.length);g.players=ids;M.seenOver=-1;var sc=ids.map(function(){return 0});while(sc.length<4)sc.push(0);try{await ON.ref.update({status:'playing',game:g,round:1,scores:sc})}catch(e){toast('Could not start ('+(e&&e.code||'error')+')')}closeBox()}
async function nextOnline(){var g=deal(ON.doc.game.n);g.players=ON.doc.game.players;closeBox();
 if(ON.net==='peer'){ON.doc.game=g;ON.doc.round++;bcast();return}
try{await ON.ref.update({game:g,round:ON.doc.round+1})}catch(e){toast('Could not deal ('+(e&&e.code||'error')+')')}}
/* ---------- peer-to-peer transport (web version) ---------- */
function peerOpts(){var o={config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'}]}};var q=new URLSearchParams(location.search).get('ps');if(q){var a=q.split(':');o.host=a[0];o.port=+a[1];o.path='/';o.secure=false}return o}
function createPeer(tries){tries=tries||0;var code=codeGen(),name=nick();ON.isHost=true;ON.conns={};var pr=new Peer('bigtwo-'+code,peerOpts());ON.peer=pr;
 pr.on('open',function(id){ON.myId=id;ON.code=code;ON.doc={host:id,status:'lobby',seats:{0:{id:id}},names:{},scores:[0,0,0,0],round:1,game:null,gone:{}};ON.doc.names[id]=name;onDoc()});
 pr.on('connection',hostConn);
 ON.dog=setInterval(function(){var d=ON.doc;if(!d)return;var now=Date.now();Object.keys(ON.conns).forEach(function(id){if(now-(ON.seen&&ON.seen[id]||now)>12000)hostDrop(id)})},3000);
 pr.on('error',function(e){if(e.type==='unavailable-id'&&tries<5){try{pr.destroy()}catch(x){}createPeer(tries+1)}else toast('Connection problem: '+(e.type||'error'),3500)})}
function hostConn(conn){conn.on('data',function(m){hostMsg(conn,m)});conn.on('close',function(){hostDrop(conn.peer)});conn.on('error',function(){hostDrop(conn.peer)})}
function hostMsg(conn,m){var d=ON.doc;if(!d||!m)return;ON.seen=ON.seen||{};ON.seen[conn.peer]=Date.now();
 if(d.gone&&d.gone[conn.peer]&&d.names[conn.peer]!==undefined){ON.conns[conn.peer]=conn;d.gone[conn.peer]=false;bcast()}
 if(m.t==='hb')return;
 if(m.t==='join'){var id=conn.peer;ON.conns[id]=conn;
  if(d.names[id]===undefined){if(d.status!=='lobby'){var gi=-1;if(d.game&&d.game.players)d.game.players.forEach(function(pid,ix){if(gi<0&&d.gone&&d.gone[pid])gi=ix});if(gi<0){conn.send({t:'full'});return}var old=d.game.players[gi];d.game.players[gi]=id;for(var q=0;q<4;q++)if(d.seats[q]&&d.seats[q].id===old)d.seats[q]={id:id};d.names[id]=String(m.name||'').slice(0,12)||d.names[old]||'';delete d.names[old];delete d.gone[old];d.gone[id]=false;bcast();return}var k=-1;for(var i=0;i<4;i++)if(!d.seats[i]){k=i;break}if(k<0){conn.send({t:'full'});return}d.seats[k]={id:id};d.names[id]=String(m.name||'').slice(0,12)}else d.gone[id]=false;
  bcast()}
 else if(m.t==='act'){var seat=d.game&&d.game.players?d.game.players.indexOf(conn.peer):-1;if(seat<0)return;hostAct(seat,m.cards)}
 else if(m.t==='again'){if(d.game&&d.game.over&&d.game.players.indexOf(conn.peer)>=0)nextOnline()}}
function hostDrop(id){var d=ON.doc;if(!d)return;delete ON.conns[id];if(d.status==='lobby'){for(var i=0;i<4;i++)if(d.seats[i]&&d.seats[i].id===id)delete d.seats[i];delete d.names[id]}else d.gone[id]=true;bcast()}
function sanitize(d,id){var c=clone(d);if(c.game){var g=c.game,me=g.players?g.players.indexOf(id):-1;g.hands=g.hands.map(function(h,i){return i===me?h:h.map(function(){return -1})});g.pile=g.pile.map(function(){return -1});if(g.drew&&g.drew.seat!==me)g.drew.card=-1}return c}
function bcast(){onDoc();for(var id in ON.conns){try{ON.conns[id].send({t:'doc',doc:sanitize(ON.doc,id)})}catch(e){}}}
function hostAct(seat,cards){if(cards==='draw')cards='passdraw';var d=ON.doc,G=d.game;if(!G||G.over)return;if(cards==='passdraw'){var pdc=passDrawCheck(G,seat);if(!pdc.ok){if(seat===M.me)toast(pdc.msg);return}G=applyPassDraw(G,seat)}else if(cards==='draw'){var dc=drawCheck(G,seat);if(!dc.ok){if(seat===M.me)toast(dc.msg);return}G=applyDraw(G,seat)}else if(cards){var c=check(G,seat,cards);if(!c.ok){if(seat===M.me)toast(c.msg);return}G=applyPlay(G,seat,cards)}else{var pc=passCheck(G,seat);if(!pc.ok){if(seat===M.me)toast(pc.msg);return}G=applyPass(G,seat)}
 d.game=G;if(G.over)d.scores=d.scores.map(function(v,i){return v+(G.delta[i]||0)});M.sel=[];bcast()}
function joinPeer(){var code=($('jc').value||'').trim().toUpperCase();if(code.length!==4){toast('Enter the 4 letter code');return}var name=nick();ON.isHost=false;var pr=new Peer(peerOpts()),joined=false;ON.peer=pr;
 pr.on('open',function(id){ON.myId=id;ON.code=code;var conn=pr.connect('bigtwo-'+code,{reliable:true});ON.conn=conn;
  conn.on('open',function(){conn.send({t:'join',name:name});clearInterval(ON.hb);ON.hb=setInterval(function(){try{conn.send({t:'hb'})}catch(e){}},4000)});
  conn.on('data',function(m){if(m.t==='doc'){joined=true;ON.doc=m.doc;onDoc()}else if(m.t==='full'){toast('That table is full or already started',3500);try{pr.destroy()}catch(e){}}});
  conn.on('close',function(){if(joined)toast('Lost the connection to the host',4000)});
  setTimeout(function(){if(!joined)toast('Could not reach that table. Check the code and try again.',3500)},10000)});
 pr.on('error',function(e){toast(e.type==='peer-unavailable'?'No table with that code':'Connection problem: '+(e.type||'error'),3500)})}
/* ---------- events ---------- */
document.addEventListener('click',function(ev){var t=ev.target.closest('[data-a],.hand .card');if(!t)return;
 if(t.classList.contains('card')){var G=M.G;if(!G)return;if(M.mode==='hot'&&G.turn!==M.viewer)return;selToggle(+t.dataset.c);return}
 var a=t.dataset.a;
 if(a==='close'){closeBox();if(M.mode==='online'&&!M.G&&ON.doc)onDoc()}
 else if(a==='rules')openBox(rulesHTML());
 else if(a==='history'){if(M.G)openBox(histHTML(false))}
 else if(a==='histall'){openBox(histHTML(false))}
 else if(a==='histmine'){openBox(histHTML(true))}
 else if(a==='scores')openBox(scoresHTML());
 else if(a==='menu'){if(M.mode&&(M.G||ON.doc)){M.paused=true;var host=M.mode==='online'&&ON.isHost;openBox('<h2>Paused</h2><div class="stack"><button class="pri" data-a="resume">Resume game</button><button data-a="scores">Scores</button><button data-a="rules">Rules</button><button class="sm" data-a="leaveask">Leave game</button></div>')}else openBox(menuHTML())}
 else if(a==='resume'){closeBox();if(M.mode==='online'&&!M.G&&ON.doc)onDoc()}
 else if(a==='leaveask'){var h2=M.mode==='online'&&ON.isHost;openBox('<h2>Leave the game?</h2><p class="c">'+(h2?'You are the host, so the table closes for everyone.':M.mode==='online'?'Your seat will be played for you.':'This round will be lost.')+'</p><div class="stack"><button class="pri" data-a="resume">Keep playing</button><button class="sm" data-a="leave">Yes, leave</button></div>')}
 else if(a==='leave'){M.paused=false;clearTimeout(M.botT);clearInterval(ON.hb);clearInterval(ON.dog);if(ON.peer){try{ON.peer.destroy()}catch(e){}ON.peer=null;ON.conn=null;ON.conns={}}ON.net=null;if(ON.unsub){ON.unsub();ON.unsub=null}M.mode=null;M.G=null;ON.doc=null;ON.botMove=-1;$('table').style.display='none';$('ov').dataset.hot='';openBox(menuHTML())}
 else if(a==='solo')startLocal('solo',1);
 else if(a==='hotpick')openBox('<h2>Pass &amp; play</h2><p class="c">How many people are playing on this phone? Bots fill the rest.</p><div class="stack"><button data-a="hot2">2 people</button><button data-a="hot3">3 people</button><button data-a="hot4">4 people</button><button class="sm" data-a="leave">Back</button></div>');
 else if(a==='hot2'||a==='hot3'||a==='hot4')startLocal('hot',+a.charAt(3));
 else if(a==='reveal'){$('ov').dataset.hot='';M.viewer=M.G.turn;closeBox();render()}
 else if(a==='online')onlineMenu();
 else if(a==='create')createTable();
 else if(a==='join')joinTable();
 else if(a==='start')startOnline();
 else if(a==='next'){closeBox();if(M.mode==='online'){if(ON.net==='peer'&&!ON.isHost){if(ON.conn)ON.conn.send({t:'again'});toast('Asked the host to deal again',1800)}else nextOnline()}else{M.round++;newRound()}}
 else if(a==='sort'){M.sortBy=M.sortBy==='rank'?'suit':'rank';render()}
 else if(a==='hint'){var G2=M.G;if(!G2)return;var me=viewSeat();var c=botChoose(G2,me,true);if(c){M.sel=c.slice();render()}else toast(G2.pile.length?'Nothing beats it. Draw a card.':'Nothing beats it. Pass.')}
 else if(a==='play'){var me2=viewSeat();if(M.G.turn===me2)act(me2,M.sel.slice())}
 else if(a==='pass'){var me3=viewSeat();if(M.G.turn===me3)act(me3,null)}
 else if(a==='draw'){var me4=viewSeat();if(M.G.turn===me4)act(me4,'draw')}
 else if(a==='passdraw'){var me5=viewSeat();if(M.G.turn===me5)act(me5,'passdraw')}});
addEventListener('resize',function(){if(M.G)render()});
window.__big2={M:M,ON:ON,classify:classify,beats:beats,deal:deal,check:check,applyPlay:applyPlay,applyPass:applyPass,botChoose:botChoose,render:render,applyDraw:applyDraw,applyPassDraw:applyPassDraw,passDrawCheck:passDrawCheck,canBeat:canBeat,passCheck:passCheck,drawCheck:drawCheck};
openBox(menuHTML());
})();
